name: Enviar código por correo
on:
  repository_dispatch:
    types: [send-code]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Llamada a SendGrid API
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.sendgrid.com/v3/mail/send'
          method: 'POST'
          customHeaders: '{"Authorization":"Bearer ${{ secrets.SENDGRID_API_KEY }}", "Content-Type":"application/json"}'
          data: '{"personalizations":[{"to":[{"email":"${{ github.event.client_payload.correo }}"}]}], "from":{"email":"administracion@misemilla.org"}, "subject":"Código de Acceso - Actualización Registros", "content":[{"type":"text/plain", "value":"¡Hola!\nTu código de validación es: ${{ github.event.client_payload.codigo }}\nDatos registrados:\n- Tipo de documento: ${{ github.event.client_payload.tipo_doc }}\n- Número de documento: ${{ github.event.client_payload.num_doc }}\n\nEste código es para el proceso de actualización de registros de Misemilla."}]}'
          
