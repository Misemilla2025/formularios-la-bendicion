name: Enviar código por correo
on:
  repository_dispatch:
    types: [send-code]
  workflow_dispatch:
    inputs:
      tipo_doc:
        required: true
        type: string
      num_doc:
        required: true
        type: string
      correo:
        required: true
        type: string

jobs:
  enviar-correo:
    runs-on: ubuntu-latest
    steps:
      - name: Generar código de validación
        id: generar-codigo
        run: echo "codigo=$(printf "%06d" $RANDOM)" >> $GITHUB_OUTPUT

      - name: Enviar con SendGrid
        uses: fjogeleit/http-request-action@v1
        with:
          url: https://api.sendgrid.com/v3/mail/send
          method: POST
          headers: '{"Authorization":"Bearer ${{ secrets.SENDGRID_API_KEY }}", "Content-Type":"application/json"}'
          data: >
            {
              "personalizations": [{"to": [{"email": "${{ github.event.inputs.correo || github.event.client_payload.correo }}"}]}],
              "from": {"email": "administracion@misemilla.org"},
              "subject": "Código de Acceso",
              "content": [{"type": "text/plain", "value": "Tu código es: ${{ steps.generar-codigo.outputs.codigo }}"}]
            }
            
