<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Registros - Misemilla</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .alert.success { background-color: #d4edda; color: #155724; }
        .alert.error { background-color: #f8d7da; color: #721c24; }
        .alert.empty { background-color: #fff3cd; color: #856404; }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="section">
        <h2>VALIDACIÓN DE ACCESO</h2>
        
        <div id="alertSuccess" class="alert success">✅ Proceso completado - revisa tu correo o spam</div>
        <div id="alertError" class="alert error">❌ Error en el proceso - revisa la configuración</div>
        <div id="alertEmpty" class="alert empty">⚠️ Completa todos los campos antes de continuar</div>

        <select id="tipo_doc" required>
            <option value="">SELECCIONE TIPO DE DOCUMENTO</option>
            <option value="CEDULA_CIUDADANIA">CEDULA DE CIUDADANIA</option>
        </select>
        <input type="text" id="num_doc" placeholder="NÚMERO DE DOCUMENTO" maxlength="10" required>
        <input type="email" id="correo" placeholder="CORREO ELECTRÓNICO ACTUAL" required>
        <button id="btnEnviar" onclick="enviarSolicitud()">VALIDAR Y ENVIAR CÓDIGO</button>
    </div>

    <script>
        const btnEnviar = document.getElementById('btnEnviar');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const alertEmpty = document.getElementById('alertEmpty');

        function ocultarAlertas() {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            alertEmpty.style.display = 'none';
        }

        async function enviarSolicitud() {
            ocultarAlertas();
            const tipoDoc = document.getElementById('tipo_doc').value;
            const numDoc = document.getElementById('num_doc').value.trim();
            const correo = document.getElementById('correo').value.trim();

            if (!tipoDoc || !numDoc || !correo) {
                alertEmpty.style.display = 'block';
                return;
            }

            btnEnviar.disabled = true;
            alertSuccess.textContent = "🔍 Procesando solicitud...";
            alertSuccess.style.display = 'block';

            try {
                // SOLUCIÓN SEGURA: Usar GitHub Actions como intermediario (sin exponer tokens)
                const respuesta = await fetch('/.github/workflows/trigger-send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipoDoc, numDoc, correo })
                });

                if (respuesta.ok) {
                    alertSuccess.textContent = "✅ Código enviado - revisa tu correo";
                } else {
                    alertError.textContent = "❌ Error al activar el proceso - revisa los workflows de GitHub";
                    alertError.style.display = 'block';
                }
            } catch (e) {
                alertError.textContent = `❌ Fallo: ${e.message}`;
                alertError.style.display = 'block';
            } finally {
                btnEnviar.disabled = false;
            }
        }

        // Asignar evento sin exponer tokens
        document.getElementById('btnEnviar').addEventListener('click', enviarSolicitud);
    </script>
</body>
</html>
