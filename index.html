<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Registros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #seccion-codigo, #contenedor-campos {
            display: none;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="section" id="seccion-validacion">
        <h2>VALIDACIÓN DE ACCESO</h2>
        <select id="tipo_doc" required>
            <option value="">SELECCIONE TIPO DE DOCUMENTO</option>
            <option value="CEDULA_CIUDADANIA">CEDULA DE CIUDADANIA</option>
        </select>
        <label>NUMERO DE DOCUMENTO</label>
        <input id="numero_documento" required>
        <label>CORREO ACTUAL</label>
        <input id="correo_validacion" type="email" required>
        <button type="button" onclick="probarEnvio()">VALIDAR Y ENVIAR CÓDIGO</button>
    </div>

    <div class="section" id="seccion-codigo">
        <h2>INGRESA EL CÓDIGO</h2>
        <input id="codigo" maxlength="6" required>
        <button type="button" onclick="verificar()">VERIFICAR CÓDIGO</button>
    </div>

    <div class="section" id="contenedor-campos">
        <h2>✅ ACCESO PERMITIDO</h2>
    </div>

    <script>
        const API_KEY = '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';
        const EMISOR = 'administracion@misemilla.org';
        const RECEPTOR = 'haralcan16@gmail.com';
        let codigoGenerado = '123456';

        async function probarEnvio() {
            try {
                // Mostramos alerta para confirmar que la función se ejecuta
                alert('🔍 Función iniciada - Verificando datos...');
                
                const correo = document.getElementById('correo_validacion').value;
                if (correo !== RECEPTOR) {
                    alert('⚠️ Correo no válido');
                    return;
                }

                alert('📧 Enviando código a tu correo...');
                const respuesta = await fetch('https://api.sendgrid.com/v3/mail/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        personalizations: [{ to: [{ email: RECEPTOR }] }],
                        from: { email: EMISOR },
                        subject: 'Código de Acceso',
                        content: [{ type: 'text/plain', value: `Tu código: ${codigoGenerado}` }]
                    })
                });

                if (respuesta.ok) {
                    alert('✅ Código enviado exitosamente!');
                    document.getElementById('seccion-validacion').style.display = 'none';
                    document.getElementById('seccion-codigo').style.display = 'block';
                } else {
                    const error = await respuesta.json();
                    alert(`❌ Error: ${error.errors[0].message}`);
                    console.log(error); // Para ver detalles en la consola del navegador
                }
            } catch (error) {
                alert(`❌ Fallo en el proceso: ${error.message}`);
                console.log(error);
            }
        }

        function verificar() {
            const codigo = document.getElementById('codigo').value;
            if (codigo === codigoGenerado) {
                alert('✅ Código correcto!');
                document.getElementById('seccion-codigo').style.display = 'none';
                document.getElementById('contenedor-campos').style.display = 'block';
            } else {
                alert('❌ Código incorrecto');
            }
        }
    </script>
</body>
</html>
