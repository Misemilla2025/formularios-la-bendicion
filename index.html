function convertirFecha(fecha){

const meses = {

"FEB":1,
"MAR":2,
"ABR":3,
"MAY":4,
"JUN":5,
"JUL":6,
"AGO":7,
"SEP":8,
"OCT":9,
"NOV":10,
"DIC":11
};

if(partes.length !== 3) return null;

const dia = parseInt(partes[0]);

const mesTexto = partes[1].substring(0,3).toUpperCase();

const mes = meses[mesTexto];

const anio = parseInt(partes[2]);

if(isNaN(dia) || isNaN(anio) || mes === undefined){
return null;
}

return new Date(anio, mes, dia);

}catch(e){
console.error(e);
return null;
}

const hoy = new Date();

if(m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())){

}

return edad;

window.enviarCodigoCorreo = async () => {

      btnEnviar.textContent = 'ENVIAR CÓDIGO AL CORREO';
    }

    return;
  }

    const res = await fetch(API_BASE + "/enviar-codigo", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        correo,
        tipoDoc,
        numDoc
      })
    });

          String(minutos).padStart(2, "0") +
          ":" +
