<script>
document.addEventListener("DOMContentLoaded",()=>{

/* =========================
   FUNCIONES
========================= */
const aMayus = v =>
  v.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const aMinus = v => v.toLowerCase();

/* =========================
   NORMALIZACIONES GENERALES
========================= */
document.querySelectorAll('input[type="text"], input:not([type])')
.forEach(el=>{
  if(
    el.type === "email" || 
    el.id === "billetera_usdt_txt"
  ) return;

  el.addEventListener("input", ()=> {
    // 🔹 TELEGRAM: solo convertir letras minúsculas a mayúsculas, números y símbolos se mantienen
    if(el.id === "telegram") {
      el.value = el.value.replace(/[a-z]/g, c => c.toUpperCase());
    } else {
      // 🔹 RESTO DE INPUTS: todo a mayúscula normal
      el.value = aMayus(el.value);
    }
  });
});

/* =========================
 EMAILS — VALIDACIÓN EN DOM (SUAVE)
========================= */

["correo_validacion","correo_nuevo_text","bancus_correo"].forEach(id=>{
  const el=document.getElementById(id);
  if(!el) return;

  el.addEventListener("input",()=>{
    el.value = el.value.toLowerCase();

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    el.setCustomValidity(
      emailRegex.test(el.value) || el.value === ""
        ? ""
        : "Correo con formato inválido"
    );
  });
});

/* =========================
   SOLO NÚMEROS
========================= */
// SOLO NUMÉRICOS
["celular","indicativo"].forEach(id=>{
  const el = document.getElementById(id);
  el && el.addEventListener("input",()=>{
    el.value = el.value.replace(/\D/g,"");
  });
});

// CÓDIGO POSTAL: letras + números + espacio
const codigoPostal = document.getElementById("codigo_postal");
codigoPostal && codigoPostal.addEventListener("input", ()=>{
  codigoPostal.value = codigoPostal.value.replace(/[^A-Za-z0-9 ]/g,"");
});

const socialSecurity = document.getElementById("social_security");

socialSecurity && socialSecurity.addEventListener("input", () => {

  // 1. Convertir a mayúsculas
  let valor = socialSecurity.value.toUpperCase();

  // 2. Permitir solo A-Z y 0-9
  valor = valor.replace(/[^A-Z0-9]/g, "");

  socialSecurity.value = valor;

});

/* =========================
   REFERENCIAS
========================= */
const paisResidencia=document.getElementById("pais_residencia");
const estado=document.getElementById("estado");
const ciudad=document.getElementById("ciudad");
const indicativo=document.getElementById("indicativo");
const paisCiudadania=document.getElementById("pais_ciudadania");
const paisPasaporte=document.getElementById("pais_pasaporte");
const idioma=document.getElementById("idioma");

/* =========================
   N/A / OTRO — GLOBAL
========================= */
document.querySelectorAll(".na-select").forEach(select=>{
  const input=document.getElementById(select.dataset.target);
  if(!input) return;

  const sync=()=>{
    if(select.value==="OTRO"){
      input.style.display="inline-block";
      input.value="";
    }else{
      input.style.display="none";
      input.value="N/A";
    }
  };

  select.addEventListener("change",sync);
  sync();
});

/* =========================
   FORZAR CAMPOS CLAVE
========================= */
[
  ["correo_nuevo","correo_nuevo_text"],
  ["pasaporte_num","pasaporte_num_text"],
  ["billetera_usdt","billetera_usdt_txt"]
].forEach(([s,t])=>{
  const sel=document.getElementById(s);
  const txt=document.getElementById(t);
  if(!sel||!txt) return;

  sel.addEventListener("change",()=>{
    if(sel.value==="OTRO"){
      txt.style.display="inline-block";
      txt.value="";
    }else{
      txt.style.display="none";
      txt.value="N/A";
    }
  });
});

/* =========================
   PAÍSES
========================= */
fetch("https://countriesnow.space/api/v0.1/countries")
.then(r=>r.json())
.then(data=>{
  data.data.forEach(p=>{
    const pais=aMayus(p.country);
    paisCiudadania.appendChild(new Option(pais,pais));
    paisResidencia.appendChild(new Option(pais,pais));
    paisPasaporte.appendChild(new Option(pais,pais));
  });
  paisPasaporte.insertBefore(new Option("N/A","N/A"), paisPasaporte.firstChild);
  paisPasaporte.value="N/A";
});

/* =========================
   PAÍS → ESTADO → CIUDAD
========================= */
paisResidencia.addEventListener("change",()=>{
  estado.innerHTML='<option value="">SELECCIONE ESTADO</option>';
  ciudad.innerHTML='<option value="">SELECCIONE CIUDAD</option>';
  estado.disabled=true;
  ciudad.disabled=true;
  indicativo.value="";

  // INDICATIVO
  fetch("https://countriesnow.space/api/v0.1/countries/codes",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({country:paisResidencia.value})
  })
  .then(r=>r.json())
  .then(d=>{
    if(d?.data?.dial_code)
      indicativo.value=d.data.dial_code.replace("+","");
  });

  // ESTADOS
  fetch("https://countriesnow.space/api/v0.1/countries/states",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({country:paisResidencia.value})
  })
  .then(r=>r.json())
  .then(d=>{

      valor_anterior: valorAnterior,
      valor_nuevo: valorNuevo,
      tipo_operacion: "ACTUALIZACION"
    });
  }
}

if (cambios.length > 0) {
  const { error: errorAuditoria } = await supabase
    .from("auditoria_actualizaciones")

}

 VISUAL N/A (AUTOMÁTICO)

<script type="module">
let timerOTP = null;
let intervalOTP = null;
let intervaloExpiracion = null; // Nueva variable para el temporizador persistente
let tiempoExpiracionCodigo = null; // Nueva variable para guardar el tiempo de expiración

const API_BASE = "https://servidor-misemilla-formulario-production.up.railway.app";

/* =========================
   ENVÍO CODIGO
========================= */

window.enviarCodigoCorreo = async () => {

  // 1. BLOQUEAR BOTÓN INMEDIATAMENTE AL HACER CLIC
  const btnEnviarCodigo = document.getElementById('btnEnviarCodigo');
  if (btnEnviarCodigo) {
    btnEnviarCodigo.disabled = true;
    btnEnviarCodigo.textContent = 'Enviando código...';
  }

  const correo = document.getElementById("correo_validacion").value.trim().toLowerCase();
  const tipoDoc = document.getElementById("tipo_doc").value;
  const numDoc = document.getElementById("numero_documento").value.trim();

  if (!correo || !numDoc) {
    alert("⚠️ Complete los datos antes de enviar el código");
    // Si hay error de datos, volvemos a activar el botón para que reintente
    if (btnEnviarCodigo) {
      btnEnviarCodigo.disabled = false;
      btnEnviarCodigo.textContent = 'ENVIAR CÓDIGO AL CORREO';
    }
    return;
  }

  try {

    const res = await fetch(API_BASE + "/enviar-codigo", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        correo,
        tipoDoc,
        numDoc
      })
    });

    const data = await res.json();
    
    if (!res.ok) {
      alert(data.mensaje || "Error enviando código");
      // Si hay error en el envío, volvemos a activar el botón para que reintente
      if (btnEnviarCodigo) {
        btnEnviarCodigo.disabled = false;
        btnEnviarCodigo.textContent = 'ENVIAR CÓDIGO AL CORREO';
      }
      return;
    }

    /* ===============================
       SOLO SI BACKEND RESPONDIÓ OK
    =============================== */

    alert(" 🔐 Codigo enviado revise su correo copié y pegué después de aceptar el numero de seis dígitos que le llego");

    const btnEnviar = document.getElementById("btnEnviarCodigo");
    const bloqueCodigo = document.getElementById("bloqueCodigo");
    const contador = document.getElementById("contadorOTP");

    if (btnEnviar) {
      btnEnviar.style.display = "none";
      btnEnviar.disabled = true; // Ya lo tenías, lo mantenemos por seguridad
    }

    if (bloqueCodigo) {
      bloqueCodigo.style.display = "block";
    }

    // ===== INICIAR CONTADOR 3 MINUTOS (PERSISTENTE) =====
    // Limpiar cualquier intervalo anterior para evitar duplicados
    if (intervaloExpiracion) {
      clearInterval(intervaloExpiracion);
    }

    tiempoExpiracionCodigo = 180; // 3 minutos en segundos

    intervaloExpiracion = setInterval(() => {
      let minutos = Math.floor(tiempoExpiracionCodigo / 60);
      let segundos = tiempoExpiracionCodigo % 60;

      if (contador) {
        contador.textContent =
          "El código expira en: " +
          String(minutos).padStart(2, "0") +
          ":" +
          String(segundos).padStart(2, "0");
      }

      tiempoExpiracionCodigo--;

      if (tiempoExpiracionCodigo < 0) {
        clearInterval(intervaloExpiracion);

        if (bloqueCodigo) bloqueCodigo.style.display = "none";
        if (btnEnviar) {
          btnEnviar.style.display = "block";
          btnEnviar.disabled = false; // Al expirar, volvemos a activar el botón
          btnEnviar.textContent = 'ENVIAR CÓDIGO AL CORREO';
        }
        if (contador) contador.textContent = "";
      }
    }, 1000);

    // respaldo de seguridad por si algo falla
    timerOTP = setTimeout(() => {}, 180000);

  } catch (e) {
    alert("⚠️ Error enviando código");
    // Si hay error de conexión o otro, volvemos a activar el botón
    if (btnEnviarCodigo) {
      btnEnviarCodigo.disabled = false;
      btnEnviarCodigo.textContent = 'ENVIAR CÓDIGO AL CORREO';
    }
  }
};


/* =========================
   VERIFICAR CODIGO
========================= */

window.verificarCodigo = async () => {

  if (timerOTP) clearTimeout(timerOTP);
  if (intervalOTP) clearInterval(intervalOTP);

  const correo = document.getElementById("correo_validacion").value.trim().toLowerCase();
  const codigo = document.getElementById("codigo_verificacion")
  .value
  .replace(/\s/g, '');
  const documento = document.getElementById("numero_documento").value.trim();
  const boton = document.getElementById("btnVerificarCodigo"); // Coincide con el HTML
  const contador = document.getElementById("contadorOTP");

  if (!codigo) {
    alert("⚠️ Ingrese el código");
    return;
  }

  try {

    const res = await fetch(API_BASE + "/verificar-codigo", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        correo,
        codigo,
        documento
      })
    });

    const data = await res.json();

    // 🛑 Agregamos esto para ver exactamente qué llega del backend
    console.log("Datos recibidos del backend:", data);
    console.log("Tipo de bloqueo recibido:", data.tipoBloqueo);

    /* ===============================
       SI BLOQUEADO (403)
    =============================== */

    if (res.status === 403) {
      let tiempo;
      let mensaje;

      // Verificar tipo de bloqueo con más tolerancia
      if (data.tipoBloqueo === "30_dias" || data.mensaje?.includes("30 días")) {
        // Bloqueo de 30 días → mensaje y tiempo correctos
        mensaje = "⛔ Ya actualizaste tu información, Bloqueado por 30 días.";
        tiempo = 30 * 24 * 60 * 60; // 30 días en segundos
      } else {
        // Bloqueo de 30 minutos → mensaje y tiempo correctos
        mensaje = "⛔ Haz ingresado el código 5 veces sin éxito, Bloqueado por 30 minutos.";
        tiempo = 30 * 60; // 30 minutos en segundos
      }

      alert(mensaje); // El alert coincide con el tipo de bloqueo

      if (boton) {
        boton.disabled = true;
      }

      intervalOTP = setInterval(() => {

        // Calcular días, horas, minutos y segundos para el bloqueo
        const dias = Math.floor(tiempo / (24 * 60 * 60));
        const horas = Math.floor((tiempo % (24 * 60 * 60)) / (60 * 60));
        const minutos = Math.floor((tiempo % (60 * 60)) / 60);
        const segundos = tiempo % 60;

        if (boton) {
          // Mostrar días solo si es mayor a 0, sino mostrar horas/minutos/segundos
          if (dias > 0) {
            boton.innerText = 
              `Bloqueado ${dias}d ${horas}h ${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
          } else {
            boton.innerText = 
              `Bloqueado ${horas}h ${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
          }
        }

        tiempo--;

        if (tiempo < 0) {
          clearInterval(intervalOTP);

          if (boton) {
            boton.disabled = false;
            boton.innerText = "Verificar Código";
          }
        }

      }, 1000);

      return;
    }

    /* ===============================
       OTROS ERRORES
    =============================== */

    if (!res.ok) {
      alert(data.mensaje || "Código inválido");
      return;
    }

    /* ===============================
       CODIGO CORRECTO
    =============================== */

    // Detener el temporizador de expiración porque el código fue validado
    if (intervaloExpiracion) {
      clearInterval(intervaloExpiracion);
    }
    if (contador) {
      contador.textContent = "";
    }

    alert("💻 Datos cargados correctamente ✅ verificación exitosa, ya puede ingresar revisar y actualizar su información");

    const formulario = document.getElementById("bloque_formulario");
    const validacion = document.getElementById("seccionValidacion");
    const modalConfirmacion = document.getElementById("modalConfirmacion");

    if (formulario) {
      formulario.style.setProperty("display", "block", "important");
    }

    if (validacion) {
      validacion.style.setProperty("display", "none", "important");
    }

    if (modalConfirmacion) {
      modalConfirmacion.style.display = "none"; // Ocultamos mensaje al entrar
    }

  } catch (e) {
    console.error("Error detallado en verificarCodigo:", e); // Para ver errores en consola
    alert("Error verificando código");
  }
};

</script>
