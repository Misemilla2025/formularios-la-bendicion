<script src="env.js"></script>
<script>
  let CODIGO_GENERADO = '123456';

  async function enviarCodigo() {
    try {
      alert('🔍 Verificando datos...');
      const correo = document.getElementById('correo_validacion').value;
      if (correo !== CONFIG.CORREO_PRUEBA) {
        alert('⚠️ Correo no válido');
        return;
      }

      alert('📧 Enviando código...');
      const respuesta = await fetch('https://api.sendgrid.com/v3/mail/send', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${CONFIG.SENDGRID_API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          personalizations: [{ to: [{ email: correo }] }],
          from: { email: CONFIG.CORREO_EMISOR },
          subject: 'Código de Acceso',
          content: [{ type: 'text/plain', value: `Tu código: ${CODIGO_GENERADO}` }]
        })
      });

      if (respuesta.ok) {
        alert('✅ Código enviado!');
        document.getElementById('seccion-validacion').style.display = 'none';
        document.getElementById('seccion-codigo').style.display = 'block';
      } else {
        alert('❌ Error en el envío');
      }
    } catch (e) {
      alert(`❌ Fallo: ${e.message}`);
    }
  }

  function verificarCodigo() {
    const codigo = document.getElementById('codigo').value;
    if (codigo === CODIGO_GENERADO) {
      alert('✅ Acceso permitido!');
      document.getElementById('seccion-codigo').style.display = 'none';
      document.getElementById('contenedor-campos').style.display = 'block';
    } else {
      alert('❌ Código incorrecto');
    }
  }
</script>
