<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Registros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="section">
        <h2>VALIDACIÓN DE ACCESO</h2>
        <select id="tipo_doc" required>
            <option value="">SELECCIONE</option>
            <option value="CEDULA_CIUDADANIA">CEDULA DE CIUDADANIA</option>
        </select>
        <input type="text" id="num_doc" required placeholder="NÚMERO DE DOCUMENTO">
        <input type="email" id="correo" required placeholder="CORREO ACTUAL">
        <button onclick="enviarCodigo()">VALIDAR Y ENVIAR CÓDIGO</button>
    </div>

    <script>
        async function enviarCodigo() {
    try {
        alert('🔍 Iniciando proceso - revisa tu correo en unos minutos');
        
        const token = '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';
        const respuesta = await fetch('https://api.github.com/repos/Misemilla2025/formularios-la-bendicion/dispatches', {
            method: 'POST',
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
                'Authorization': `token ${token}`
            },
            body: JSON.stringify({
                event_type: 'send-code'
            })
        });

        const respuestaTexto = await respuesta.text();
        if (respuesta.ok) {
            alert('✅ Proceso completado - revisa tu bandeja de entrada o spam');
        } else {
            alert(`❌ Error ${respuesta.status}: ${respuestaTexto}`);
        }
    } catch (e) {
        alert(`❌ Fallo: ${e.message}`);
    }
}

    </script>
</body>
</html>
