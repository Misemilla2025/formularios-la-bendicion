<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Registros - Misemilla</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        button {
            background-color: #28a745; 
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .alert.success { background-color: #d4edda; color: #155724; }
        .alert.error { background-color: #f8d7da; color: #721c24; }
        .alert.loading { background-color: #d1ecf1; color: #0c5460; }
        .alert.empty { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="section">
        <h2>VALIDACIÓN DE ACCESO</h2>
        
        <div id="alertSuccess" class="alert success">✅ Proceso completado - revisa tu bandeja de entrada o spam</div>
        <div id="alertError" class="alert error">❌ Error en el proceso - intenta nuevamente</div>
        <div id="alertLoading" class="alert loading">🔍 Iniciando proceso - por favor espera</div>
        <div id="alertEmpty" class="alert empty">⚠️ Completa todos los campos antes de continuar</div>

        <select id="tipo_doc" required>
            <option value="">SELECCIONE TIPO DE DOCUMENTO</option>
            <option value="CEDULA_CIUDADANIA">CEDULA DE CIUDADANIA</option>
        </select>
        <input type="text" id="num_doc" required placeholder="NÚMERO DE DOCUMENTO" maxlength="10">
        <input type="email" id="correo" required placeholder="CORREO ELECTRÓNICO ACTUAL" >
        <button id="btnEnviar" onclick="enviarCodigo()">VALIDAR Y ENVIAR CÓDIGO</button>
    </div>

    <script>
        const btnEnviar = document.getElementById('btnEnviar');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const alertLoading = document.getElementById('alertLoading');
        const alertEmpty = document.getElementById('alertEmpty');

        async function enviarCodigo() {
            ocultarAlertas();

            const tipoDoc = document.getElementById('tipo_doc').value;
            const numDoc = document.getElementById('num_doc').value.trim();
            const correo = document.getElementById('correo').value.trim();

            if (!tipoDoc || !numDoc || !correo) {
                alertEmpty.style.display = 'block';
                return;
            }

            alertLoading.style.display = 'block';
            btnEnviar.disabled = true;

            try {
                const codigoValidacion = Math.floor(100000 + Math.random() * 900000).toString();
                
                // Enviamos los datos al workflow a través de un formulario oculto o una petición a un archivo de acción
                const formData = new FormData();
                formData.append('tipo_doc', tipoDoc);
                formData.append('num_doc', numDoc);
                formData.append('correo', correo);
                formData.append('codigo', codigoValidacion);

                // Llamamos a un archivo PHP o a un servicio de proxy, pero como usamos GitHub, mejor ajustamos el workflow para que se active con un formulario web
                // SOLUCIÓN SIMPLE Y SEGURA: Usar GitHub Forms o un servicio como Formspree (gratuito) para ocultar la key
                const respuesta = await fetch('https://formspree.io/f/[TU_ID_DE_FORMSPREE]', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (respuesta.ok) {
                    alertSuccess.style.display = 'block';
                } else {
                    const errorDetalles = await respuesta.json().catch(() => ({ message: 'Error al enviar datos' }));
                    alertError.textContent = `❌ Error: ${errorDetalles.message}`;
                    alertError.style.display = 'block';
                }
            } catch (e) {
                alertError.textContent = `❌ Fallo: ${e.message}`;
                alertError.style.display = 'block';
            } finally {
                alertLoading.style.display = 'none';
                btnEnviar.disabled = false;
            }
        }

        function ocultarAlertas() {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            alertLoading.style.display = 'none';
            alertEmpty.style.display = 'none';
        }
    </script>
</body>
</html>
