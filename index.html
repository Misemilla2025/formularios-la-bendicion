<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Registros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #seccion-codigo, #contenedor-campos {
            display: none;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="section" id="seccion-validacion">
        <h2>VALIDACIÓN DE ACCESO</h2>
        <select id="tipo_doc" required>
            <option value="">SELECCIONE TIPO DE DOCUMENTO</option>
            <option value="CEDULA_CIUDADANIA">CEDULA DE CIUDADANIA</option>
            <option value="CEDULA_VENEZOLANA">CEDULA VENEZOLANA</option>
        </select>

        <label>NUMERO DE DOCUMENTO</label>
        <input id="numero_documento" required>

        <label>CORREO ACTUAL</label>
        <input id="correo_validacion" type="email" required>

        <button type="button" onclick="enviarCodigo()">VALIDAR Y ENVIAR CÓDIGO</button>
    </div>

    <div class="section" id="seccion-codigo">
        <h2>INGRESA EL CÓDIGO RECIBIDO</h2>
        <input id="codigo_recibido" maxlength="6" placeholder="Ej: 123456" required>
        <button type="button" onclick="verificarCodigo()">VERIFICAR CÓDIGO</button>
    </div>

    <div class="section" id="contenedor-campos">
        <h2>✅ ACCESO PERMITIDO</h2>
        <p>Datos de prueba cargados correctamente</p>
        <p><strong>Correo:</strong> haralcan16@gmail.com</p>
    </div>

    <script>
        // DATOS CONFIGURADOS
        const SENDGRID_API_KEY = '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';
        const CORREO_EMISOR = 'administracion@misemilla.org';
        const CORREO_PRUEBA = 'haralcan16@gmail.com';
        let CODIGO_GENERADO = '123456';

        async function enviarCodigo() {
            const correo = document.getElementById('correo_validacion').value.trim();
            
            if (correo !== CORREO_PRUEBA) {
                alert('⚠️ Solo se permite haralcan16@gmail.com para prueba');
                return;
            }

            await fetch('https://api.sendgrid.com/v3/mail/send', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SENDGRID_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    personalizations: [{ to: [{ email: CORREO_PRUEBA }] }],
                    from: { email: CORREO_EMISOR },
                    subject: 'Código de Acceso',
                    content: [{ type: 'text/plain', value: `Tu código es: ${CODIGO_GENERADO}` }]
                })
            });

            alert('✅ Código enviado a haralcan16@gmail.com');
            document.getElementById('seccion-validacion').style.display = 'none';
            document.getElementById('seccion-codigo').style.display = 'block';
        }

        function verificarCodigo() {
            const codigo = document.getElementById('codigo_recibido').value;
            if (codigo === CODIGO_GENERADO) {
                alert('✅ Código correcto!');
                document.getElementById('seccion-codigo').style.display = 'none';
                document.getElementById('contenedor-campos').style.display = 'block';
            } else {
                alert('⚠️ Código incorrecto');
            }
        }
    </script>
</body>
</html>
